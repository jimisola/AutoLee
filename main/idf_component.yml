dependencies:
  idf: ">=5.3"
  lvgl/lvgl: "^8.4.0"
  espressif/esp_lvgl_port: "^2.3.0"
  # No AXS5106L touch component: the ones on the registry (e.g.
  # mydazy/esp_lcd_touch_axs5106l) hard-require LVGL 9's lv_indev_create()
  # API, incompatible with the LVGL 8.4 this project (and its still-to-port
  # ui_touch.cpp) is pinned to. main/axs5106l_touch.cpp ports the I2C
  # protocol from third_party/esp_lcd_touch_axs5106l/ (the vendored Arduino
  # driver) directly instead - same chip, same registers, no framework dep.
