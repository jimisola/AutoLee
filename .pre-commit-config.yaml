# Optional local hooks. Enable with:  pre-commit install
# CI enforces the same checks with `pre-commit run --all-files`.

# Vendored third-party code (TMC-API, PsychicHttp, ESP-IDF's dns_server and
# rmt/stepper_motor examples) - kept verbatim from upstream, not ours to
# reformat.
exclude: ^lib/(tmc_api|psychic_http|dns_server)/|^main/stepper_motor_encoder\.[ch]$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        files: ^(main|lib|test)/.*\.(cpp|h)$
