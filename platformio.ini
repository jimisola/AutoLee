; PlatformIO project configuration for AutoLee
;
;  env:esp32-c6  — builds the firmware for the WaveShare ESP32-C6 board
;  env:native    — builds & runs the host unit tests (no hardware needed)
;
; The sketch itself stays in AutoLee/ (so the Arduino IDE still works); PlatformIO
; just points src_dir at it. Pure, hardware-independent logic lives in
; lib/autolee_logic/ and is shared by both the firmware and the native tests.

[platformio]
src_dir = AutoLee

[env:esp32-c6]
; ESP32-C6 needs arduino-esp32 3.x, provided by the pioarduino platform fork
; (the stock "espressif32" platform lagged on 2.x with no C6 support).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv     ; Minimal SPIFFS (1.9 MB APP w/ OTA)
monitor_speed = 115200
build_flags =
    -I AutoLee                ; so LVGL finds lv_conf.h (with the flag below)
    -D LV_CONF_INCLUDE_SIMPLE
lib_extra_dirs =
    third_party               ; the vendored Waveshare esp_lcd_touch_axs5106l driver
lib_deps =
    lvgl/lvgl@8.4.0
    moononournation/GFX Library for Arduino@1.6.6
    teemuatlut/TMCStepper@0.7.3
    gin66/FastAccelStepper@1.2.7
    ESP32Async/ESPAsyncWebServer@3.11.2
    ESP32Async/AsyncTCP@3.4.10

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>       ; don't build the firmware sources on the host
build_flags =
    -std=gnu++17
    -I lib/autolee_logic
