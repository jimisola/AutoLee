name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run host unit tests
        run: pio test -e native

      - name: Build firmware (ESP32-C6)
        run: pio run -e esp32-c6

      - name: Static analysis (cppcheck via pio check)
        run: pio check -e esp32-c6 --skip-packages --fail-on-defect=high

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install PlatformIO + gcovr
        run: pip install --upgrade platformio gcovr
      - name: Coverage (host logic)
        run: |
          pio test -e native-coverage
          gcovr --root . --filter 'lib/autolee_logic/' --fail-under-line 80 --txt

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install validators
        run: pip install --upgrade check-jsonschema pyyaml
      - name: Validate the state example against the shared schema
        run: check-jsonschema --schemafile api/schemas/state.schema.json api/schemas/state.example.json
      - name: Sanity-check the API spec files parse
        run: |
          python -c "import yaml,sys; yaml.safe_load(open('api/openapi.yaml')); print('api/openapi.yaml OK')"
          python -c "import yaml,sys; yaml.safe_load(open('api/asyncapi.yaml')); print('api/asyncapi.yaml OK')"
