name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run host unit tests
        run: pio test -e native

      - name: Build firmware (ESP32-C6)
        run: pio run -e esp32-c6

      - name: Static analysis (cppcheck via pio check)
        run: pio check -e esp32-c6 --skip-packages --fail-on-defect=high

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO + gcovr
        run: pip install --upgrade platformio gcovr
      - name: Coverage (host logic)
        run: |
          pio test -e native-coverage
          gcovr --root . --filter 'lib/autolee_logic/' --fail-under-line 80 --txt

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: pip install --upgrade check-jsonschema pyyaml
      - name: Validate the state example against the shared schema
        run: check-jsonschema --schemafile schemas/state.schema.json schemas/state.example.json
      - name: Sanity-check the API spec files parse
        run: |
          python -c "import yaml,sys; yaml.safe_load(open('openapi.yaml')); print('openapi.yaml OK')"
          python -c "import yaml,sys; yaml.safe_load(open('asyncapi.yaml')); print('asyncapi.yaml OK')"
