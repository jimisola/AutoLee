name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so release.yml can gate a release on the same checks that guard
  # main, rather than reimplementing them and letting the two drift.
  workflow_call:
  # Manual runs: re-checking main without pushing anything — a suspected flake,
  # or a newly released ESP-IDF / clang-format / spectral that could turn CI red
  # with no commit here to hang the re-run on.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: idf.py build (esp32c6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v7.0.0
        with:
          persist-credentials: false
      - uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae # v1
        with:
          version: "v5.3.2"
      - name: Build
        run: |
          idf.py set-target esp32c6
          idf.py build

  host-tests:
    name: Host tests (host_test/, ctest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v7.0.0
        with:
          persist-credentials: false
      # host_test/ is a native host build - it only needs one vendored
      # source file from ESP-IDF (components/unity), not a toolchain.
      # install-esp-idf-action was tried first, but its cross-toolchain
      # leaks into this build's `as`/`ld` resolution no matter what env
      # vars get reset in this step (PATH, COMPILER_PATH - both tried,
      # neither fixed "as: unrecognized option '--64'"), implying a
      # system-level change (e.g. gcc specs) the action makes, not a
      # process-env one. Sparse-clone just the one directory needed instead.
      - name: Fetch Unity source (the one thing host_test/ needs from ESP-IDF)
        # components/unity/unity in the esp-idf repo is a submodule of
        # ThrowTheSwitch/Unity - clone that directly into the same path
        # shape host_test/CMakeLists.txt expects ($IDF_PATH/components/
        # unity/unity/src), instead of cloning esp-idf itself.
        run: |
          mkdir -p /tmp/esp-idf-unity/components/unity
          git init -q /tmp/esp-idf-unity/components/unity/unity
          git -C /tmp/esp-idf-unity/components/unity/unity fetch --depth 1 \
            https://github.com/ThrowTheSwitch/Unity.git \
            bf560290f6020737eafaa8b5cbd2177c3956c03f
          git -C /tmp/esp-idf-unity/components/unity/unity checkout -q FETCH_HEAD
          echo "IDF_PATH=/tmp/esp-idf-unity" >> "$GITHUB_ENV"
      - name: Configure, build, and run
        working-directory: host_test
        run: |
          cmake -B build -DAUTOLEE_COVERAGE=ON
          cmake --build build -j
          cd build && ctest --output-on-failure
      - name: Coverage report
        working-directory: host_test
        run: |
          pip install -r ../.github/requirements-ci.txt
          # Regression floor, NOT a target to chase: actual coverage is ~98%,
          # but the gate is deliberately set far below that so it only trips on
          # a real accident (a whole suite silently stops running, or a large
          # untested module lands). Keeping it loose avoids pressuring
          # low-value tests just to hold a number - the real coverage figure is
          # printed above for reviewers to judge on quality, not quantity.
          gcovr --root .. --filter '../lib/autolee_logic/' --fail-under-line 80 build

  lint:
    name: Lint (clang-format, ruff, yamllint, API specs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: pre-commit (clang-format, ruff, yamllint, basic checks)
        run: |
          pip install -r .github/requirements-ci.txt
          pre-commit run --all-files --show-diff-on-failure
      - name: Lint API specs (spectral)
        run: npx --yes @stoplight/spectral-cli@6.16.3 lint api/openapi.yaml api/asyncapi.yaml
      - name: API contract check (state.example.json against the schema)
        run: |
          pip install -r .github/requirements-ci.txt
          python -c "
          import json, jsonschema
          schema = json.load(open('api/schemas/state.schema.json'))
          example = json.load(open('api/schemas/state.example.json'))
          jsonschema.validate(example, schema)
          print('state.example.json matches state.schema.json')
          "

  # The workflows lint the firmware; nothing linted the workflows. Both tools
  # here catch a class of mistake that otherwise only shows up as a failed
  # release: actionlint parses the expression syntax and the shell inside `run:`
  # (a typo'd `${{ needs.x.outputs.y }}` silently expands to the empty string
  # rather than erroring), and zizmor audits for the CI-specific security
  # footguns — unpinned actions, credentials left in .git/config, untrusted
  # input interpolated into a shell.
  #
  # This matters more now that release.yml is workflow_dispatch-driven: it can
  # only be exercised by actually running a release, so static checking is most
  # of the feedback it gets.
  #
  # Versions are pinned because an unpinned linter fails PRs that changed
  # nothing. Nothing updates these automatically — see .github/dependabot.yml
  # for why, and bump them by hand when convenient.
  workflows:
    name: Lint the workflows themselves (actionlint, zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v7.0.0
        with:
          persist-credentials: false

      # Checksum-verified: a GitHub release asset is mutable upstream, so the
      # tag alone is not a pin.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/
          rm actionlint.tar.gz

      - name: actionlint
        run: actionlint .github/workflows/*.yml

      - name: Install zizmor
        run: pip install zizmor==1.29.0

      # --min-severity medium: the low tier is mostly stylistic and would make
      # this job advisory in practice. yamllint already runs via pre-commit in
      # the lint job above, so it is not repeated here.
      - name: zizmor
        run: zizmor --min-severity medium .github/workflows/
