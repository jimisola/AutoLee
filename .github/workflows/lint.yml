name: Lint

# Everything that can be checked without a toolchain: formatting, the API
# specs, the workflows themselves, and the release-notes config.
#
# Split out from the old single ci.yml (see build.yml's header for why). These
# jobs are seconds each and need no ESP-IDF install, so a formatting mistake
# gets its answer back long before the firmware build finishes.

on:
  push:
    branches: [main]
  pull_request:
  # Callable so release.yml can gate a release on the same checks that guard
  # main, rather than reimplementing them and letting the two drift.
  workflow_call:
  # Manual runs: several of these pin an external tool (clang-format, spectral,
  # git-cliff), so they can go red when that tool changes rather than when this
  # repo does — and then need re-running with no commit to hang it on.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit (clang-format, ruff, basic checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: pre-commit
        run: |
          pip install -r .github/requirements-ci.txt
          pre-commit run --all-files --show-diff-on-failure

  api:
    name: API specs (spectral + schema contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Lint API specs (spectral)
        run: npx --yes @stoplight/spectral-cli@6.16.3 lint api/openapi.yaml api/asyncapi.yaml
      - name: API contract check (state.example.json against the schema)
        run: |
          pip install -r .github/requirements-ci.txt
          python -c "
          import json, jsonschema
          schema = json.load(open('api/schemas/state.schema.json'))
          example = json.load(open('api/schemas/state.example.json'))
          jsonschema.validate(example, schema)
          print('state.example.json matches state.schema.json')
          "

  # The workflows lint the firmware; nothing linted the workflows. Both tools
  # here catch a class of mistake that otherwise only shows up as a failed
  # release: actionlint parses the expression syntax and the shell inside `run:`
  # (a typo'd `${{ needs.x.outputs.y }}` silently expands to the empty string
  # rather than erroring), and zizmor audits for the CI-specific security
  # footguns — unpinned actions, credentials left in .git/config, untrusted
  # input interpolated into a shell.
  #
  # This matters more now that release.yml is workflow_dispatch-driven: it can
  # only be exercised by actually running a release, so static checking is most
  # of the feedback it gets.
  #
  # Versions are pinned because an unpinned linter fails PRs that changed
  # nothing. Nothing updates these automatically — see .github/dependabot.yml
  # for why, and bump them by hand when convenient.
  workflows:
    name: Lint the workflows themselves (actionlint, zizmor, yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v7.0.0
        with:
          persist-credentials: false

      # Checksum-verified: a GitHub release asset is mutable upstream, so the
      # tag alone is not a pin.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/
          rm actionlint.tar.gz

      - name: actionlint
        run: actionlint .github/workflows/*.yml

      - name: Install zizmor
        run: pip install zizmor==1.29.0

      # --min-severity medium: the low tier is mostly stylistic and would make
      # this job advisory in practice. The composite actions are audited too —
      # they run with the caller's permissions, including the contents: write
      # the release job holds.
      - name: zizmor
        run: zizmor --min-severity medium .github/workflows/ .github/actions/

      # Not in .pre-commit-config.yaml: that config's hooks are the ones worth
      # running on every commit across the whole tree, and yamllint on the
      # generated/vendored YAML elsewhere in the repo is noise. Scoped here to
      # the two directories that are hand-written CI config.
      - name: Install yamllint
        run: pip install -r .github/requirements-ci.txt

      - name: yamllint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            .github/workflows/ .github/actions/

  # cliff.toml decides the version a release gets when the version input is left
  # empty, so a wrong answer here ships a wrong release — and it is only
  # exercised by cutting one. Pin the mapping RELEASING.md documents against
  # throwaway repos instead, on every PR.
  release-config:
    name: Release version mapping (cliff.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v7.0.0
        with:
          persist-credentials: false

      # Same install the release uses — this job asserts its bump mapping.
      - uses: ./.github/actions/setup-git-cliff

      - name: Assert the bump mapping RELEASING.md documents
        run: |
          set -euo pipefail

          # Each case: a subject to commit on top of tag 1.2.3, and the version
          # git-cliff should then compute for the next release.
          CLIFF="$PWD/cliff.toml"

          check() {
            subject="$1"
            expected="$2"
            repo="$(mktemp -d)"
            git init -q "$repo"
            git -C "$repo" config user.name ci
            git -C "$repo" config user.email ci@example.com
            # A signing key configured globally (true on a maintainer's machine,
            # where this is also runnable) would otherwise fail every commit.
            git -C "$repo" config commit.gpgsign false
            git -C "$repo" config tag.gpgsign false
            git -C "$repo" commit -q --allow-empty -m "chore: init"
            git -C "$repo" tag 1.2.3
            git -C "$repo" commit -q --allow-empty -m "$subject"
            got="$(git-cliff --repository "$repo" --config "$CLIFF" --bumped-version)"
            rm -rf "$repo"
            if [ "$got" != "$expected" ]; then
              echo "::error::'$subject' on 1.2.3 bumped to '$got', expected '$expected'"
              exit 1
            fi
            echo "'$subject' -> $got ✓"
          }

          check "fix: a bug"               1.2.4
          check "feat: a feature"          1.3.0
          check "feat!: a breaking change" 2.0.0
          check "docs: a doc"              1.2.4
          # ci/build/tools are skipped by cliff.toml, so a range containing only
          # those bumps to nothing — auto-detect returns the tag that already
          # exists and release.yml's "tag is free" check rejects it. That is the
          # intended outcome (there is nothing in such a release for whoever
          # flashes the board); pass a version explicitly to override.
          check "ci: tweak a workflow"     1.2.3
