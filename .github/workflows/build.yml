name: Build

# The things that prove the firmware works: it compiles for the target, and the
# hardware-independent logic in lib/autolee_logic/ passes its host tests.
#
# Split out from the old single ci.yml so that the slow, toolchain-heavy jobs
# and the cheap static checks (lint.yml) report separately: a clang-format nit
# and a broken build are different failures, and having them under one check
# name made it impossible to require only one of them in branch protection or
# to re-run only the one that failed.

on:
  push:
    branches: [main]
  pull_request:
  # Callable so release.yml can gate a release on the same checks that guard
  # main, rather than reimplementing them and letting the two drift.
  workflow_call:
  # Manual runs: re-checking main without pushing anything — a suspected flake,
  # or a newly released ESP-IDF that could turn CI red with no commit here to
  # hang the re-run on.
  workflow_dispatch:

permissions:
  contents: read

# A superseded push should not keep running. The literal prefix keeps this
# group apart from the other workflows release.yml calls, where
# github.workflow is the caller's name for all of them.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both jobs are required checks, so they always run and report, and skip their
# steps instead when .github/scripts/changed_areas.py says the pull request
# cannot affect them. Only an explicit 'false' skips: if the classifier fails,
# its output is empty and everything runs.
jobs:
  firmware:
    name: firmware (esp32c6)
    runs-on: ubuntu-latest
    env:
      IDF_CCACHE_ENABLE: "1"
      # IDF writes picolibc.specs into the build directory, and ccache's default
      # compiler_check hashes its mtime: a restored cache would never hit.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 200M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, for the classifier.
          fetch-depth: 2

      - name: Classify the change
        id: areas
        continue-on-error: true
        run: python3 .github/scripts/changed_areas.py >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-esp-idf
        if: steps.areas.outputs.firmware != 'false'

      - name: Install ccache
        if: steps.areas.outputs.firmware != 'false'
        run: sudo apt-get install -y --no-install-recommends ccache

      # Saved from main only, so pull requests all start from one warm cache
      # rather than each adding their own.
      - name: Restore the compiler cache
        if: steps.areas.outputs.firmware != 'false'
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: >-
            ccache-esp32c6-${{ hashFiles('main/**', 'lib/**', 'include/**', 'CMakeLists.txt',
            'sdkconfig.defaults', 'partitions.csv', 'dependencies.lock',
            '.github/workflows/build.yml', '.github/actions/setup-esp-idf/action.yml') }}
          restore-keys: ccache-esp32c6-

      - name: Build
        if: steps.areas.outputs.firmware != 'false'
        run: |
          # shellcheck source=/dev/null
          . ~/esp-idf/export.sh > /dev/null
          export CCACHE_DIR=~/.ccache
          ccache --zero-stats
          idf.py set-target esp32c6
          idf.py build
          ccache --show-stats

      - name: Save the compiler cache
        if: >-
          steps.areas.outputs.firmware != 'false' && github.ref == 'refs/heads/main'
          && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # The build re-solves main/idf_component.yml and rewrites the lock in
      # place, so a stale committed lock would otherwise pass silently (#106).
      - name: Check dependencies.lock is current
        if: steps.areas.outputs.firmware != 'false'
        run: |
          if ! git diff --exit-code -- dependencies.lock; then
            echo "::error::dependencies.lock does not match main/idf_component.yml and the pinned ESP-IDF. Run idf.py reconfigure and commit the lock."
            exit 1
          fi

  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Classify the change
        id: areas
        continue-on-error: true
        run: python3 .github/scripts/changed_areas.py >> "$GITHUB_OUTPUT"

      # host_test/ is a native host build - it only needs one vendored
      # source file from ESP-IDF (components/unity), not a toolchain.
      # install-esp-idf-action was tried first, but its cross-toolchain
      # leaks into this build's `as`/`ld` resolution no matter what env
      # vars get reset in this step (PATH, COMPILER_PATH - both tried,
      # neither fixed "as: unrecognized option '--64'"), implying a
      # system-level change (e.g. gcc specs) the action makes, not a
      # process-env one. Sparse-clone just the one directory needed instead.
      - name: Fetch Unity source (the one thing host_test/ needs from ESP-IDF)
        if: steps.areas.outputs.firmware != 'false'
        # components/unity/unity in the esp-idf repo is a submodule of
        # ThrowTheSwitch/Unity - clone that directly into the same path
        # shape host_test/CMakeLists.txt expects ($IDF_PATH/components/
        # unity/unity/src), instead of cloning esp-idf itself.
        run: |
          mkdir -p /tmp/esp-idf-unity/components/unity
          git init -q /tmp/esp-idf-unity/components/unity/unity
          git -C /tmp/esp-idf-unity/components/unity/unity fetch --depth 1 \
            https://github.com/ThrowTheSwitch/Unity.git \
            bf560290f6020737eafaa8b5cbd2177c3956c03f
          git -C /tmp/esp-idf-unity/components/unity/unity checkout -q FETCH_HEAD
          echo "IDF_PATH=/tmp/esp-idf-unity" >> "$GITHUB_ENV"
      - name: Configure, build, and run
        if: steps.areas.outputs.firmware != 'false'
        working-directory: host_test
        run: |
          cmake -B build -DAUTOLEE_COVERAGE=ON
          cmake --build build -j
          cd build && ctest --output-on-failure
      - name: Coverage report
        if: steps.areas.outputs.firmware != 'false'
        working-directory: host_test
        run: |
          pip install -r ../.github/requirements-ci.txt
          # Regression floor, NOT a target to chase: actual coverage is ~98%,
          # but the gate is deliberately set far below that so it only trips on
          # a real accident (a whole suite silently stops running, or a large
          # untested module lands). Keeping it loose avoids pressuring
          # low-value tests just to hold a number - the real coverage figure is
          # printed above for reviewers to judge on quality, not quantity.
          gcovr --root .. --filter '../lib/autolee_logic/' --fail-under-line 80 build
