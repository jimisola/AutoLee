name: Release firmware

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v7.0.0

      # The firmware version is derived from git at build time
      # (esp_app_desc_t.version <- `git describe --always --tags --dirty`), so a
      # clean checkout of tag X.Y.Z (bare, always full three-part semver - no "v"
      # prefix, see CONTRIBUTING.md) always reports exactly that tag - there is
      # no source file to cross-check. The literal "v" in the artifact filenames
      # below is prose, not the version string - it stays even though the tag
      # itself is bare.
      - name: Release version
        id: ver
        run: |
          echo "ver=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae # v1
        with:
          version: "v5.3.2"

      - name: Build
        run: |
          idf.py set-target esp32c6
          idf.py build

      - name: Merge full-flash image + rename artifacts
        run: |
          idf.py merge-bin -o build/AutoLee_v${{ steps.ver.outputs.ver }}_merged.bin --fill-flash-size 4MB
          cp build/autolee.bin build/AutoLee_v${{ steps.ver.outputs.ver }}_update.bin

      - name: Attach to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          files: |
            build/AutoLee_v${{ steps.ver.outputs.ver }}_merged.bin
            build/AutoLee_v${{ steps.ver.outputs.ver }}_update.bin
