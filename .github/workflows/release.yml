name: Release firmware

# Fires when a GitHub Release is *published* (created + not a draft).
#
# For maintainers (recommended, via the web UI):
#   1. Bump FW_VERSION in src/config.h and merge it to main first.
#   2. GitHub -> Releases -> "Draft a new release".
#   3. Choose/create a tag named  vX.Y  (must match FW_VERSION, e.g. v1.9 -> "1.9").
#   4. Publish. This workflow builds the firmware (PlatformIO) and attaches the
#      two .bin assets (merged + update) to that same release.
#
# The build uses the pinned toolchain in platformio.ini — the single source of
# truth for library/platform versions (same as CI and local builds).

on:
  release:
    types: [published]

permissions:
  contents: write        # required to upload assets onto the release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # -- Fail in seconds if the release tag doesn't match FW_VERSION ---------
      - name: Version guard (tag must match FW_VERSION)
        id: ver
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          FW="$(grep -oP '#define\s+FW_VERSION\s+"\K[^"]+' src/config.h)"
          echo "Release tag ${GITHUB_REF_NAME} -> version '${VER}'; config.h FW_VERSION='${FW}'"
          if [ "${VER}" != "${FW}" ]; then
            echo "::error::Release tag (${GITHUB_REF_NAME} -> ${VER}) does not match FW_VERSION in src/config.h (${FW}). Bump config.h and re-tag."
            exit 1
          fi
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (ESP32-C6)
        run: pio run -e esp32-c6

      - name: Assemble release artifacts
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.ver }}"
          B=.pio/build/esp32-c6
          mkdir -p dist
          # firmware.factory.bin = bootloader+partitions+app, flashed at 0x0.
          # firmware.bin         = app-only image, used for OTA updates.
          test -f "$B/firmware.factory.bin" || { echo "::error::firmware.factory.bin missing"; exit 1; }
          cp "$B/firmware.factory.bin" "dist/AutoLee_v${VER}_merged.bin"
          cp "$B/firmware.bin"         "dist/AutoLee_v${VER}_update.bin"
          ls -la dist/

      - name: Attach firmware to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoLee_v${{ steps.ver.outputs.ver }}_merged.bin
            dist/AutoLee_v${{ steps.ver.outputs.ver }}_update.bin
