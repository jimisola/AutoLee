name: Release

# The whole release, start to finish, in one workflow.
#
# Previously this fired on `release: published` and did nothing but build. That
# ordering was backwards in two ways. The release was public *before* the
# firmware existed — so for the length of a cold ESP-IDF build there was a live
# release advertising `autolee-X.Y.Z-factory.bin` with no such file attached,
# and if the build failed the release stayed public and permanently empty, with
# a tag already pushed. And nothing verified the artifacts at all: the version
# in the filename came from the tag name, while the version actually *inside*
# the binary comes from `git describe` at CMake-configure time. Nothing checked
# that those two agreed.
#
# The shape that fixes both is to make the release invisible until it has been
# verified:
#
#   prepare  ->  checks  ->  [approval]  ->  release (prerelease + assets)
#                                              ->  verify the published assets
#                                              ->  promote to latest
#
# A prerelease is the key. It is publicly readable by exact tag, so the
# published assets can be downloaded and checked for real, but /releases/latest
# excludes it — so the release page's "Latest" badge, and anything that resolves
# `latest`, cannot see it yet. If verification fails, nobody was ever served a
# release: the tag and the prerelease stay for a human to delete or supersede.
#
# Not a draft, deliberately: a draft's assets are not readable without an
# authenticated token, so the verify job could not exercise the same download
# path a user gets. A prerelease can.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release — bare, full three-part semver: 2.0.0, never 2.0 or
          v2.0.0 (see CONTRIBUTING.md, "Versioning & releases"). Leave empty to
          auto-detect from the Conventional Commits since the last tag.
        required: false
        type: string
      force:
        description: "Allow a version that disagrees with the auto-detected one."
        required: false
        type: boolean
        default: false
      dry-run:
        description: "Validate and preview only — no checks run, no tag pushed, nothing published."
        required: false
        type: boolean
        default: true

# There is deliberately no `ref` input. The release is cut from the ref this
# workflow was dispatched on (choose it in the "Run workflow" dropdown), because
# that is the only way the reusable `checks` jobs below can be guaranteed to
# test the same commit that gets tagged: `uses: ./.github/workflows/build.yml`
# always resolves to the caller's ref, not to an arbitrary input. `prepare`
# asserts that commit is on main.

permissions:
  contents: read

# One release at a time. Two concurrent runs would race on the tag push and
# could leave the second one having built artifacts for a tag it cannot create.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Resolves and validates what would be released, and writes the summary
  # including the notes. Deliberately does nothing durable: a dry run is exactly
  # this job and nothing else, so previewing a release costs one cheap job
  # rather than a full ESP-IDF build.
  prepare:
    name: Validate the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      auto: ${{ steps.resolve.outputs.auto }}
      source: ${{ steps.resolve.outputs.source }}
      previous: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v7.0.0
        with:
          persist-credentials: false
          # Full history + tags: git-cliff needs every commit back to the last
          # tag to compute the bump and the notes, and the checks below need to
          # see every existing tag and to resolve main.
          fetch-depth: 0

      - uses: ./.github/actions/setup-git-cliff

      # Shape-checks the input before anything else looks at it. Empty passes —
      # that is the "auto-detect" case, resolved below.
      - uses: ./.github/actions/check-version
        with:
          version: ${{ inputs.version }}

      # Captured before the release job creates the new tag — `git describe` run
      # after that would find the just-created tag instead.
      - name: Record previous tag
        id: previous
        env:
          SHA: ${{ github.sha }}
        run: |
          echo "tag=$(git describe --tags --abbrev=0 "$SHA" 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      # Before anything looks at versions: a commit gets exactly one release,
      # and no input — `force` included — overrides that. Tagging an
      # already-tagged commit bakes the *wrong* version into the firmware:
      # `git describe --tags` picks arbitrarily between two tags at distance 0,
      # so PROJECT_VER can come out as the older one. The readback assertion in
      # the release job does catch it, but only after the approval gate and a
      # cold ESP-IDF build. This costs a second.
      - name: Check the ref is not already released
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          EXISTING="$(git tag --points-at "$SHA" | paste -sd' ' -)"
          if [ -n "$EXISTING" ]; then
            echo "::error::${SHA:0:12} is already released as '$EXISTING'. There is nothing new to release from it — merge your commits to main first."
            exit 1
          fi

      - name: Resolve version
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          # cliff.toml's template reads commit.remote.* (the "by @user in #N" attribution), which makes
          # git-cliff call the GitHub API even for --bumped-version; unauthenticated it rate-limits and panics.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTO="$(git-cliff --config cliff.toml --bumped-version)"

          if [ -z "$REQUESTED" ]; then
            VERSION="$AUTO"
            SOURCE="auto-detected from Conventional Commits"
            # git-cliff answers with the tag that already exists when nothing in
            # the range earns a bump — only ci:/build:/tools:, or nothing
            # conventional at all. The tag check below would then fail on "tag
            # already exists", which describes the symptom and invites the wrong
            # fix (bump past it and force), so name the actual cause here.
            if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
              MSG="Nothing to release: no commits since '$VERSION' earn a version bump (see RELEASING.md, 'Auto-detected versions')."
              echo "::error::$MSG Pass a version explicitly with force if you really do want to ship them."
              exit 1
            fi
          else
            # Already shape-checked by check-version above.
            VERSION="$REQUESTED"
            if [ "$VERSION" != "$AUTO" ]; then
              if [ "$FORCE" != "true" ]; then
                echo "::error::Version '$VERSION' disagrees with the auto-detected '$AUTO'. Re-run with force enabled if that is deliberate."
                exit 1
              fi
              echo "::warning::Forcing '$VERSION' over the auto-detected '$AUTO'."
              SOURCE="user-specified (forced over '$AUTO')"
            else
              SOURCE="user-specified (matches auto-detected)"
            fi
          fi

          # Auto-detect can legitimately return nothing useful — e.g. no tags
          # *and* no conventional commits to infer a bump from. Better to fail
          # here than to try tagging an empty string.
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a version to release. Pass one explicitly."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "auto=$AUTO"
            echo "source=$SOURCE"
          } >> "$GITHUB_OUTPUT"

      # The auto-detected value comes from git-cliff, not from the input, so it
      # has not been through check-version. cliff.toml's tag_pattern makes a
      # non-semver result unlikely, but the tag is the version the firmware
      # reports — cheap to re-assert, expensive to get wrong.
      - uses: ./.github/actions/check-version
        with:
          version: ${{ steps.resolve.outputs.version }}

      - name: Check the tag is free and the ref is on main
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag '$VERSION' already exists. Releases are immutable; pick the next version."
            exit 1
          fi

          # Releases come off main. Reachability, not equality, so an older
          # commit on main can still be released — and since `checks` runs at
          # this same SHA, what is verified is what is tagged.
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not reachable from origin/main. Merge to main first."
            exit 1
          fi

      # --strip all: no header, no footer, no version heading — the release page
      # already shows the version. GITHUB_TOKEN lets git-cliff resolve each
      # squashed commit to its PR number and author for the "in #N by @who"
      # suffixes; without it the notes still render, just barer.
      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git-cliff --config cliff.toml --latest --unreleased --strip all --output NOTES.md

      # Handed to the release job rather than regenerated there: the notes the
      # reviewer approved at the gate are then provably the notes that ship.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: NOTES.md

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          AUTO: ${{ steps.resolve.outputs.auto }}
          SOURCE: ${{ steps.resolve.outputs.source }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          # Test the value: "false" is non-empty, so ${DRY_RUN:+...} would
          # expand for both.
          if [ "$DRY_RUN" = "true" ]; then
            HEADING="Release (dry run)"
            MODE='dry run — nothing tagged, nothing published'
          else
            HEADING="Release"
            MODE='checks, then approval, then tag + prerelease + verify + promote'
          fi
          {
            echo "### $HEADING ${VERSION:-(unresolved)}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION:-(unresolved)}\` |"
            echo "| Auto-detected | \`${AUTO:-(none)}\` |"
            echo "| Source | ${SOURCE:-(unresolved)} |"
            echo "| Previous tag | \`${PREVIOUS:-(none yet)}\` |"
            echo "| Ref | \`$REF\` @ \`${SHA:0:12}\` |"
            echo "| Mode | $MODE |"
            echo ""
            echo "#### Release notes"
            echo ""
            cat NOTES.md 2>/dev/null || echo "_(not generated — an earlier step failed)_"
            echo ""
            # Anything listed here but missing above was dropped as
            # unconventional, or as a skipped ci:/build:/tools: type.
            echo "<details><summary>Commits since \`${PREVIOUS:-the beginning}\`</summary>"
            echo ""
            if [ -n "$PREVIOUS" ]; then
              git log "${PREVIOUS}..${SHA}" --format="- %h %s"
            else
              git log "$SHA" --format="- %h %s" | head -40
            fi
            echo ""
            echo "</details>"
            echo ""
            echo "Artifacts that will be attached:"
            echo ""
            echo "- \`autolee-${VERSION}-factory.bin\` — full flash image (fresh install, 4 MB)"
            echo "- \`autolee-${VERSION}-ota.bin\` — app image only (OTA / re-flash)"
            echo "- \`SHA256SUMS.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The same checks that guard main, called rather than reimplemented, and run
  # *before* the approval gate — so the reviewer is approving something already
  # green rather than a version string.
  build:
    name: Checks
    needs: prepare
    if: ${{ !inputs.dry-run }}
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  lint:
    name: Checks
    needs: prepare
    if: ${{ !inputs.dry-run }}
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  # THE APPROVAL GATE. `environment: stable` is what makes this job sit pending
  # until a required reviewer approves it. By that point the summary above shows
  # the version, the previous tag and the notes, and the checks are green.
  #
  # ⚠️  The `stable` environment must exist WITH a required reviewer. GitHub
  # auto-creates a named environment on first use with NO protection rules at
  # all, so if it has not been configured by hand this job runs straight through
  # and the gate silently does nothing. Environment protection rules are free on
  # public repositories. See RELEASING.md.
  release:
    name: Tag, build and create the prerelease
    needs: [prepare, build, lint]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment:
      name: stable
      url: ${{ steps.create.outputs.url }}
    permissions:
      contents: write
    outputs:
      factory_sha256: ${{ steps.build.outputs.factory_sha256 }}
      ota_sha256: ${{ steps.build.outputs.ota_sha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      # Tagged locally first, and pushed only once the artifacts built from it
      # have been checked. The version is baked into the binary from
      # `git describe` at CMake-configure time, so the tag has to exist before
      # the build for the firmware to report the right version — but nothing is
      # published to the world until the assertions below pass.
      - name: Create the tag locally
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Annotated, not lightweight: `git describe` prefers annotated tags
          # and orders them by tagger date, so a commit that somehow ends up
          # carrying two tags still resolves to the newer one. Belt to the
          # already-released check in `prepare`, which is the actual brace.
          # Tags 0.1.0 and 1.0.0 predate this and stay lightweight.
          git tag -a -m "$VERSION" "$VERSION"

      - uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae # v1
        with:
          version: "v6.0.2"

      - name: Build and package
        id: build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # set-target is what runs CMake configure, and configure is when
          # PROJECT_VER is captured from `git describe`. The tag above therefore
          # has to already exist — it does. A fresh runner has no stale build/
          # to serve a cached version from, which is the failure mode
          # CONTRIBUTING.md warns about for local builds.
          idf.py set-target esp32c6
          idf.py build

          # The real assertion, and the reason this job exists at all: the
          # version in the artifact *filename* comes from the tag, while the
          # version inside the binary comes from `git describe` at configure
          # time. Three documented things can make them disagree — a cached
          # PROJECT_VER, `git describe` picking the nearest tag rather than the
          # highest semver, and a dirty tree appending "-dirty". Read it back
          # out of the image rather than trusting any of that.
          BUILT="$(python3 tools/app_desc.py build/autolee.bin --field version)"
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::Firmware reports version '$BUILT', not '$VERSION' — refusing to release."
            exit 1
          fi
          echo "Firmware reports $BUILT ✓"

          # -o is relative to build/, not the project root: idf.py runs esptool
          # with the build dir as its cwd, so a "build/" prefix here would fail.
          idf.py merge-bin -o "autolee-${VERSION}-factory.bin" --pad-to-size 4MB
          cp build/autolee.bin "build/autolee-${VERSION}-ota.bin"

          # The factory image is assembled by a separate esptool pass, so check
          # it independently — a merge that picked up a stale build/autolee.bin
          # would otherwise ship a full-flash image disagreeing with the OTA one.
          FACTORY="$(python3 tools/app_desc.py "build/autolee-${VERSION}-factory.bin" --scan --field version)"
          if [ "$FACTORY" != "$VERSION" ]; then
            echo "::error::Factory image reports version '$FACTORY', not '$VERSION' — refusing to release."
            exit 1
          fi
          echo "Factory image reports $FACTORY ✓"

          cd build
          sha256sum "autolee-${VERSION}-factory.bin" "autolee-${VERSION}-ota.bin" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "factory_sha256=$(sha256sum "autolee-${VERSION}-factory.bin" | cut -d' ' -f1)"
            echo "ota_sha256=$(sha256sum "autolee-${VERSION}-ota.bin" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      # persist-credentials: false means `origin` carries no auth; push to an
      # explicit tokenised URL rather than leaving a credential in .git/config.
      - name: Push the tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$VERSION"

      # --prerelease is what keeps this invisible until verified: publicly
      # readable by exact tag, so the verify job can download it exactly as a
      # user would, but excluded from /releases/latest.
      #
      # Assets are passed to `create` rather than uploaded afterwards, so the
      # release never exists in a state where its firmware is missing — the
      # window this whole rewrite is about.
      #
      # --notes-file, not --generate-notes: these are the git-cliff notes
      # generated in `prepare` and shown at the approval gate, so what ships is
      # what was approved.
      - name: Create the prerelease with its artifacts
        id: create
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file NOTES.md \
            --prerelease \
            "build/autolee-${VERSION}-factory.bin" \
            "build/autolee-${VERSION}-ota.bin" \
            build/SHA256SUMS.txt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Prerelease created"
            echo ""
            echo "\`$VERSION\` — $URL"
            echo ""
            echo "Not the latest release yet: \`/releases/latest\` excludes prereleases."
            echo "It is promoted only if the verification below passes."
          } >> "$GITHUB_STEP_SUMMARY"

  # Downloads the published assets over the same public path a user takes, and
  # re-derives everything from the bytes that actually landed. This is a
  # different claim from the build job's: that one proved the *build* was
  # correct, this proves the *upload* was — a truncated or clobbered asset is
  # invisible to the build and fatal to whoever flashes it.
  verify:
    name: Verify the published artifacts
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v7.0.0
        with:
          persist-credentials: false

      - name: Download the release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl
          gh release download "$VERSION" --dir dl
          ls -l dl

      - name: Verify checksums, sizes and embedded versions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FACTORY_SHA256: ${{ needs.release.outputs.factory_sha256 }}
          OTA_SHA256: ${{ needs.release.outputs.ota_sha256 }}
        run: |
          set -euo pipefail
          cd dl

          # Self-consistency of the published manifest...
          sha256sum -c SHA256SUMS.txt

          # ...and that the manifest itself describes what was built, not
          # whatever happened to be uploaded alongside it.
          echo "${FACTORY_SHA256}  autolee-${VERSION}-factory.bin" | sha256sum -c -
          echo "${OTA_SHA256}  autolee-${VERSION}-ota.bin" | sha256sum -c -

          # --pad-to-size 4MB, so anything else means the merge or the
          # upload was truncated.
          SIZE="$(stat -c%s "autolee-${VERSION}-factory.bin")"
          if [ "$SIZE" -ne 4194304 ]; then
            echo "::error::Factory image is $SIZE bytes, expected 4194304 (4 MB)."
            exit 1
          fi

          for f in "autolee-${VERSION}-ota.bin:" "autolee-${VERSION}-factory.bin:--scan"; do
            BIN="${f%%:*}"
            FLAGS="${f##*:}"
            # shellcheck disable=SC2086
            GOT="$(python3 ../tools/app_desc.py "$BIN" $FLAGS --field version)"
            if [ "$GOT" != "$VERSION" ]; then
              echo "::error::$BIN reports version '$GOT', not '$VERSION'."
              exit 1
            fi
            echo "$BIN reports $GOT ✓"
          done

  # The moment the release becomes real. One flag flip, with the assets already
  # in place and checked — so there is no window in which the latest release
  # points at firmware that has not landed.
  promote:
    name: Promote to latest
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote the prerelease
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release edit "$VERSION" --repo "$REPO" --prerelease=false --latest
          {
            echo "### Released"
            echo ""
            echo "\`$VERSION\` is now the latest release."
          } >> "$GITHUB_STEP_SUMMARY"
