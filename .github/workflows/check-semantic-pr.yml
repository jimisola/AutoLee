name: Check Semantic PR

# .commitlintrc.yml has been in this repo with nothing running it — the
# Conventional Commits rule CONTRIBUTING.md states was honour-system. This is
# the check behind it.
#
# It validates the PR *title*, not the commits, because the repo squash-merges:
# the title is what becomes the commit subject on main. Keep the type list below
# in sync with .commitlintrc.yml's `type-enum` (note the extra `tools`, which is
# this project's addition to config-conventional's defaults).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  semantic-pr:
    name: semantic PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Scopes are freeform and optional here (CONTRIBUTING.md), so don't
          # require one — but a scope that *is* given still has to parse.
          requireScope: false
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
            tools
