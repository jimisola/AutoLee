name: Check version
description: >-
  Fail unless the value is a bare, full three-part semver (2.0.0 — no v prefix,
  no X.Y shorthand). Empty passes: the release workflow treats that as
  "auto-detect".

inputs:
  version:
    description: "Version to validate. Empty is accepted (nothing to check)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        [ -z "$VERSION" ] && exit 0
        # The tag string *is* the version the firmware reports
        # (esp_app_desc_t.version, /api/v1/state), so it must be a semver value
        # with nothing to strip — hence no "v" and no X.Y. The v case is called
        # out separately because it is the mistake people actually make, and a
        # bare regex failure would not say what to do instead.
        if [ "${VERSION#v}" != "$VERSION" ]; then
          echo "::error::'$VERSION' has a 'v' prefix. Tags here are bare — use '${VERSION#v}'."
          exit 1
        fi
        if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
          echo "::error::'$VERSION' is not bare three-part semver (e.g. 2.0.0). See CONTRIBUTING.md, 'Versioning & releases'."
          exit 1
        fi
