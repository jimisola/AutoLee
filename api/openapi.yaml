openapi: 3.1.0
info:
  title: AutoLee HTTP API
  version: "1.0"
  description: >
    REST control surface served by the AutoLee firmware's on-device web server.
    All mutating endpoints are POST; the canonical device state is returned by
    `GET /api/v1/state` and pushed continuously over Server-Sent Events at `/api/v1/events`
    (see asyncapi.yaml). Parameters are passed as query parameters.

    Authentication: every state-changing endpoint (all POSTs, including the OTA
    upload) requires HTTP Digest auth. Reads (`GET /api/v1/state`, the dashboard
    and the SSE stream) are deliberately open - they expose only the cycle
    counter, SSID and IP. The password is stored in NVS and is changeable via
    `POST /api/v1/system/web_password`; the shipped factory default is public, so change
    it on first setup. Until it is changed, every state-changing endpoint except
    `POST /api/v1/system/web_password` itself returns 403 (`DefaultPasswordActive`) -
    the device will not run, calibrate or accept an OTA upload while the
    factory-default password is still in effect. `GET /api/v1/state`'s
    `defaultPassword` field reflects this.
  license:
    name: CC BY-NC 4.0
    url: https://creativecommons.org/licenses/by-nc/4.0/
servers:
  - url: http://autolee.local
    description: Device on the local network (mDNS)
  - url: http://{deviceIp}
    variables:
      deviceIp: { default: "192.168.4.1" }

tags:
  - name: Device
    description: Canonical device state and the live event stream.
  - name: Motion
    description: >
      Everything that moves the press or tunes how it moves - run/stop, speed
      profile, StallGuard trip and work zone, motor current, endpoint offsets,
      batches, calibration, homing and the piece counter.
  - name: Settings
    description: Stored calibration/tuning as a whole (factory reset).
  - name: WiFi
    description: Station credentials - save and reboot, or clear and fall back to the setup AP.
  - name: Diagnostics
    description: Read-only build identity, runtime health and the stored core dump.
  - name: System
    description: >
      Device administration - web/API password, log buffer and OTA firmware
      upload.

paths:
  /api/v1/state:
    get:
      summary: Full device state
      tags: [Device]
      operationId: getState
      responses:
        "200":
          description: Current device state
          content:
            application/json:
              schema:
                $ref: "./schemas/state.schema.json"

  /api/v1/motion/toggle_run:
    post:
      summary: Start or stop the run
      tags: [Motion]
      operationId: toggleRun
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/motion/profile:
    post:
      summary: Select the active speed profile
      tags: [Motion]
      operationId: setProfile
      parameters:
        - name: idx
          in: query
          required: true
          schema: { type: integer, enum: [0, 1, 2] }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/motion/sg_trip:
    post:
      summary: Set or adjust the StallGuard trip for a profile
      tags: [Motion]
      operationId: setSgTrip
      parameters:
        - { name: value, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1023 } }
        - { name: delta, in: query, required: false, schema: { type: integer } }
        - { name: profile, in: query, required: false, description: "Target profile (defaults to active)", schema: { type: integer, enum: [0, 1, 2] } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/motion/current:
    post:
      summary: Set motor run current (mA)
      tags: [Motion]
      operationId: setCurrent
      parameters:
        - name: ma
          in: query
          required: true
          schema: { type: integer, minimum: 1000, maximum: 4500 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/motion/work_zone:
    post:
      summary: Adjust the SG work-zone blanking distance
      tags: [Motion]
      operationId: setWorkZone
      parameters:
        - { name: delta, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/motion/endpoint:
    post:
      summary: Adjust an endpoint offset
      tags: [Motion]
      operationId: adjustEndpoint
      parameters:
        - { name: which, in: query, required: true, schema: { type: string, enum: [up, down] } }
        - { name: delta, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/motion/batch:
    post:
      summary: Adjust batch target or start/clear a batch
      tags: [Motion]
      operationId: batch
      parameters:
        - { name: delta, in: query, required: false, schema: { type: integer } }
        - { name: action, in: query, required: false, schema: { type: string, enum: [start, clear] } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/motion/calibrate:
    post:
      summary: Start a sensorless endpoint calibration
      description: >
        Runs the StallGuard calibration that discovers the UP and DOWN hard stops
        and stores the raw endpoints. Deferred to the motion task and re-checked
        there; the response is 200 as soon as the request is queued.
      tags: [Motion]
      operationId: calibrate
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/motion/return_home:
    post:
      summary: Creep to the UP hard stop and re-reference the axis
      description: >
        Homes the press against the UP hard stop and clears the stale-position
        flag. Deferred to the motion task and re-checked there; the response is
        200 as soon as the request is queued.
      tags: [Motion]
      operationId: returnHome
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/motion/reset_counter:
    post:
      summary: Zero the piece counter
      description: >
        Resets the cycle counter to 0. Does not touch calibration, tuning or the
        batch target.
      tags: [Motion]
      operationId: resetCounter
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/settings/reset:
    post:
      summary: Discard stored calibration and tuning, restore factory defaults
      description: >
        Erases this firmware's settings blob in NVS and restores the compiled-in
        defaults (endpoints cleared, offsets, per-profile StallGuard trips, run
        current, work zone, active profile and counter), leaving the device
        uncalibrated. It does NOT touch the WiFi credentials, the AP key or the
        web password. Destructive - confirm in the UI first. Deferred to the
        motion task, where it is applied only while the machine is IDLE and is
        silently ignored otherwise (the response is 200 either way).
      tags: [Settings]
      operationId: resetSettings
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/wifi/save:
    post:
      summary: Save WiFi credentials and reboot
      tags: [WiFi]
      operationId: setWifi
      parameters:
        - { name: ssid, in: query, required: true, schema: { type: string } }
        - { name: pass, in: query, required: false, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/wifi/reset:
    post:
      summary: Clear saved WiFi and reboot into AP mode
      tags: [WiFi]
      operationId: resetWifi
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/diagnostics/info:
    get:
      summary: Firmware/hardware diagnostics
      description: >
        Build identity (version, IDF version, compile date/time, truncated ELF SHA-256),
        last reset reason, heap stats, uptime, the currently-running OTA partition label,
        and whether a valid coredump is waiting in the `coredump` partition. A GET, so -
        like every other read on this device - it is left open, not Digest-gated.
      tags: [Diagnostics]
      operationId: getInfo
      responses:
        "200":
          description: Diagnostics snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - version
                  - idfVersion
                  - compileDate
                  - compileTime
                  - elfSha256
                  - resetReason
                  - freeHeap
                  - minFreeHeap
                  - uptimeMs
                  - runningPartition
                  - coredumpPresent
                properties:
                  version: { type: string, description: "esp_app_desc_t.version" }
                  idfVersion: { type: string, description: "esp_app_desc_t.idf_ver" }
                  compileDate: { type: string }
                  compileTime: { type: string }
                  elfSha256: { type: string, description: "First 8 bytes of the ELF SHA-256, hex" }
                  resetReason: { type: string, description: "esp_reset_reason(), e.g. POWERON, PANIC, TASK_WDT" }
                  freeHeap: { type: integer, description: "esp_get_free_heap_size(), bytes" }
                  minFreeHeap: { type: integer, description: "esp_get_minimum_free_heap_size(), bytes" }
                  uptimeMs: { type: integer, description: "esp_timer_get_time() / 1000" }
                  runningPartition: { type: string, description: "Label of the running OTA slot, e.g. ota_0" }
                  coredumpPresent: { type: boolean, description: "esp_core_dump_image_check() == ESP_OK" }

  /api/v1/diagnostics/coredump:
    get:
      summary: Download the stored core dump, if any
      description: >
        Streams the raw `coredump` partition (ELF format) as a file download. Validated via
        `esp_core_dump_image_check()` before streaming - returns 404 rather than any bytes if
        no valid coredump is present. Decode with `idf.py coredump-info` against the matching
        firmware ELF. **Digest-gated despite being a GET** - unlike every other read on this
        device, a coredump is a raw RAM snapshot and can contain the WiFi or web password in
        plaintext (both are held in local C buffers at runtime).
      tags: [Diagnostics]
      operationId: getCoredump
      responses:
        "200":
          description: Raw coredump partition contents
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: No valid core dump present

  /api/v1/system/web_password:
    post:
      summary: Change the web UI / API password
      description: >
        Sets a new Digest-auth password and persists it to NVS. Takes effect
        immediately - no reboot. Itself authenticated, so only a caller who
        already knows the current password can change it.
      tags: [System]
      operationId: setWebPassword
      parameters:
        - name: pass
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
          description: The new password.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { description: Missing or over-long password }
        "500": { description: Could not persist the password to NVS }

  /api/v1/system/log_clear:
    post:
      summary: Clear the log ring buffer
      tags: [System]
      operationId: clearLog
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }

  /api/v1/system/ota:
    post:
      summary: Upload firmware (OTA)
      tags: [System]
      operationId: otaUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: App-only .bin image
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/DefaultPasswordActive" }
security:
  - digestAuth: []

components:
  securitySchemes:
    digestAuth:
      type: http
      scheme: digest
      description: >
        Required for all POST endpoints. Digest rather than Basic because the
        device serves plain HTTP - Basic would put the password on the wire in
        reversible base64 on every request.
  responses:
    Ok:
      description: >
        Accepted. The updated state is pushed to all clients over `/api/v1/events`
        (and is readable via `GET /api/v1/state`).
    DefaultPasswordActive:
      description: >
        Refused: the web/API password is still the factory default. Every
        state-changing endpoint except `POST /api/v1/system/web_password` returns this
        until a real password is set (see `defaultPassword` in the state schema).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, message]
            properties:
              error: { type: string, enum: [default_password] }
              message: { type: string }
