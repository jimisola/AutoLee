asyncapi: 3.1.0
info:
  title: AutoLee event stream (SSE)
  version: "1.0"
  description: >
    Server-Sent Events pushed by the AutoLee firmware on `GET /api/v1/events`. Two event
    types share the channel: the default `message` event carries the full device
    state (same schema as `GET /api/v1/state`, see openapi.yaml) roughly every
    250 ms; the named `log` event carries newly appended log lines.
  license:
    name: CC BY-NC 4.0
    url: https://creativecommons.org/licenses/by-nc/4.0/

servers:
  device:
    host: autolee.local
    protocol: http
    description: Device on the local network; open an EventSource on /api/v1/events.

channels:
  events:
    address: /api/v1/events
    description: The Server-Sent Events stream.
    messages:
      state:
        $ref: "#/components/messages/state"
      log:
        $ref: "#/components/messages/log"

operations:
  receiveEvents:
    action: receive
    channel:
      $ref: "#/channels/events"
    summary: Subscribe to device state + log events.
    messages:
      - $ref: "#/channels/events/messages/state"
      - $ref: "#/channels/events/messages/log"

components:
  messages:
    state:
      name: state
      title: State snapshot
      summary: Default (unnamed) SSE 'message' event — full device state, ~every 250 ms.
      contentType: application/json
      payload:
        $ref: "./schemas/state.schema.json"
    log:
      name: log
      title: Log lines
      summary: Named SSE 'log' event — newly appended log lines.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [log]
        properties:
          log:
            type: array
            items:
              type: string
